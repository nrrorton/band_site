<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nick Squared - Book Us</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- NAVIGATION -->
    <nav class="navbar">
        <div class="navbar-container">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.svg" alt="Nick Squared Logo" style="height: 40px; width: auto; margin-right: 0.5rem; vertical-align: middle;">
                <span>Nick Squared</span>
            </a>
            <div class="navbar-menu" id="navbarMenu">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="merchandise.html">Merch</a>
                <a class="nav-link" href="booking.html">Book Us</a>
            </div>
            <button class="navbar-toggle" id="navbarToggle">☰</button>
        </div>
    </nav>

    <!-- PAGE HERO -->
    <div class="hero-section">
        <h1>Book Nick Squared</h1>
        <p class="hero-text">Ready to bring the energy to your event? Fill out the form below and let's talk!</p>
    </div>

    <!-- BOOKING FORM -->
    <div class="form-container">
        <h2 style="text-align: center; color: var(--accent-orange); margin-bottom: 2rem;">Booking Request</h2>
        <form id="bookingForm" method="POST"
            action="https://band-site-f7lfmcnwz-nrrortons-projects.vercel.app/api/submit-booking">
            <div class="mb-3">
                <label class="form-label">Your Name *</label>
                <input type="text" name="name" class="form-control" required>
            </div>
    
            <div class="mb-3">
                <label class="form-label">Email *</label>
                <input type="email" name="email" class="form-control" required>
            </div>
    
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control">
            </div>
    
            <div class="mb-3">
                <label class="form-label">Event Date</label>
                <input type="date" name="eventDate" class="form-control">
            </div>
    
            <div class="mb-3">
                <label class="form-label">Venue Name</label>
                <input type="text" name="venueName" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Event Details</label>
                <textarea name="message" class="form-control" rows="4" placeholder="Tell us about your event..."></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Special Song Requests</label>
                <textarea name="songRequests" class="form-control" rows="3" placeholder="Any songs you'd like us to play? Just let us know!"></textarea>
            </div>
    
            <button type="submit" class="btn btn-primary w-100">Send Booking Request</button>
        </form>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="merchandise.html">Merch</a>
            <a href="booking.html">Book Us</a>
        </div>
        <p class="footer-text">© 2026 Nick Squared - A Technical Band Decision. All rights reserved.</p>
    </footer>

    <style>
        .navbar-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-menu {
            display: flex;
            gap: 2rem;
        }

        .navbar-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--accent-orange);
            font-size: 1.5rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .navbar-menu {
                display: none;
                position: absolute;
                top: 60px;
                right: 0;
                flex-direction: column;
                background: var(--charcoal);
                padding: 1rem;
                width: 100%;
                border-bottom: 2px solid var(--accent-orange);
            }

            .navbar-menu.active {
                display: flex;
            }

            .navbar-toggle {
                display: block;
            }
        }
    </style>

    <script>
        // Mobile menu toggle
        document.getElementById('navbarToggle').addEventListener('click', function() {
            document.getElementById('navbarMenu').classList.toggle('active');
        });

        // Close menu when a link is clicked
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navbarMenu').classList.remove('active');
            });
        });
    </script>

</body>

</html>
